name: Auto Update Data

on:
  schedule:
    # Запускать каждый день в 12:00 и 21:00 по UTC (15:00 и 00:00 по Москве)
    - cron: '0 12,21 * * *'
  # Позволяет запускать скрипт вручную из интерфейса GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Важно для возможности сделать push обратно в репозиторий
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgbm-dev libnss3 libatk-bridge2.0-0 libxkbcommon0 libxdamage1 libpango-1.0-0 libcairo2 libxcomposite1 libasound2


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18' # Puppeteer хорошо работает на 18+

      - name: Install dependencies
        run: npm install

      # Устанавливаем системные зависимости для Puppeteer на Linux
      - name: Install Puppeteer dependencies
        run: npx puppeteer browsers install chrome

      - name: Run update script
        run: node update-data.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          # Если изменений нет, git commit вернет ошибку, поэтому используем || echo
          git commit -m "🤖 Автоматическое обновление данных с cyberfootball.online" || echo "Нет новых данных для обновления"
          git push
