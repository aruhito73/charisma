name: Auto Update Data

on:
  push:
    branches: [ main ]
  schedule:
    # Запускать каждый день в 12:00 и 21:00 по UTC (15:00 и 00:00 по Москве)
    - cron: '0 12,21 * * *'
  # Позволяет запускать скрипт вручную из интерфейса GitHub
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-data:
    # Используем Ubuntu 22.04, так как она полностью совместима с текущими зависимостями Puppeteer
    runs-on: ubuntu-22.04
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Puppeteer Browser and System Deps
        run: npx puppeteer browsers install chrome --install-deps

      - name: Run update script
        run: node update-data.js

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/*.json
          git commit -m "🤖 Автоматическое обновление данных" || echo "Нет новых данных для обновления"
          git push
